[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
lib_deps = 
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	adafruit/Adafruit GFX Library@^1.12.6
	lsatan/SmartRC-CC1101-Driver-Lib@^3.0.2
	sui77/rc-switch@^2.6.4
	bblanchon/ArduinoJson@^7.2.2
